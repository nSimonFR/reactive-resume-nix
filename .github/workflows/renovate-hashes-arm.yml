name: Renovate aarch64 hashes

# Second leg of the hash recompute. renovate.yml runs on x86_64 and can only fill
# the x86_64-linux pnpmDeps slot; this re-runs ci/renovate-update.sh on a native
# arm64 runner and pushes the aarch64-linux slot onto the same Renovate branch.
# Started by renovate.yml via workflow_dispatch (a GITHUB_TOKEN push never fires
# `push` triggers); pushes made here cannot re-trigger it for the same reason.

on:
  push:
    branches: ["renovate/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renovate-hashes-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aarch64-hashes:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # The Pi builds against nic-os's nixpkgs pin, and the aarch64 hash differs
      # from this flake's own nixos-unstable.
      - name: Read the consumer's nixpkgs pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(gh api repos/nSimonFR/nic-os/contents/flake.lock --jq .content | base64 -d |
                jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev')
          [ -n "$rev" ] && [ "$rev" != null ] || { echo "no nixpkgs rev in nic-os flake.lock"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Recompute the aarch64-linux pnpmDeps hash
        env:
          SKIP_SRC_HASH: "1"
          NIXPKGS_REV: ${{ steps.pin.outputs.rev }}
        run: bash ci/renovate-update.sh

      - name: Commit and push if the aarch64 slot changed
        run: |
          if git diff --quiet -- package.nix; then
            echo "aarch64-linux hash already correct; nothing to push"
            exit 0
          fi
          git config user.name  "nSimonFR-ai"
          git config user.email "265587706+nSimonFR-ai@users.noreply.github.com"
          git add package.nix
          git commit -m "chore(deps): recompute aarch64-linux pnpmDeps hash"
          git push origin "HEAD:${GITHUB_REF_NAME}"
